# Turkish SLAM-ASR: Optimized for Google Colab (T4 16GB) & Local RTX A4000 (16GB)
# Common Voice Turkish (Whisper-Small + Qwen2.5-7B with 4-bit NF4 Quantization)

model:
  speech_encoder_name_or_path: "openai/whisper-small"
  llm_name_or_path: "Qwen/Qwen2.5-7B-Instruct"
  encoder_dim: 768
  llm_dim: 3584
  downsample_rate: 5
  projector_type: "linear"
  projector_hidden_dim: 2048
  projector_padding_mode: "discard"
  freeze_encoder: true
  freeze_llm: true
  default_prompt: "Konuşmayı metne dönüştürün."
  torch_dtype: "bfloat16"
  load_in_4bit: true

data:
  train_manifest: "data/cv/train.jsonl"
  val_manifest: "data/cv/val.jsonl"
  test_manifest: "data/cv/test.jsonl"
  sampling_rate: 16000
  is_whisper: true
  whisper_mel_bins: 80
  batch_size: 4
  num_workers: 4

training:
  output_dir: "./outputs/slam_asr_cv_turkish_colab"
  learning_rate: 0.0001
  weight_decay: 0.0
  warmup_steps: 1000
  max_steps: 20000
  gradient_accumulation_steps: 4  # Effective batch size: 16
  logging_steps: 25
  eval_steps: 500
  save_steps: 1000
  early_stopping_patience: 10
  fp16: false
  bf16: true
