# Lightweight SLAM-ASR Setup: HuBERT-base + TinyLlama-1.1B-Chat
# Fast to train, low VRAM footprint (<8 GB VRAM), great for prototyping and testing

model:
  speech_encoder_name_or_path: "facebook/hubert-base-ls960"
  llm_name_or_path: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
  encoder_dim: 768
  llm_dim: 2048
  downsample_rate: 5
  projector_type: "linear"
  projector_hidden_dim: 2048
  projector_padding_mode: "discard"
  freeze_encoder: true
  freeze_llm: true
  default_prompt: "Transcribe speech to text."
  torch_dtype: "float16"

data:
  train_manifest: "data/train.jsonl"
  val_manifest: "data/dev-other.jsonl"
  test_manifest: "data/test-clean.jsonl"
  sampling_rate: 16000
  is_whisper: false
  batch_size: 6
  num_workers: 2

training:
  output_dir: "./outputs/slam_asr_tinyllama_hubert"
  learning_rate: 0.0001
  weight_decay: 0.0
  warmup_steps: 500
  max_steps: 20000
  gradient_accumulation_steps: 1
  logging_steps: 20
  eval_steps: 500
  save_steps: 1000
  early_stopping_patience: 5
  fp16: true
