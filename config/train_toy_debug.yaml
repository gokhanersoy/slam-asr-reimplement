# Quick Toy Config for pipeline debugging and verification
model:
  speech_encoder_name_or_path: "facebook/hubert-base-ls960"
  llm_name_or_path: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
  encoder_dim: 768
  llm_dim: 2048
  downsample_rate: 5
  projector_type: "linear"
  projector_hidden_dim: 2048
  projector_padding_mode: "discard"
  freeze_encoder: true
  freeze_llm: true
  default_prompt: "Transcribe speech to text."
  torch_dtype: "float32"

data:
  train_manifest: "data/sample_train.jsonl"
  val_manifest: "data/sample_val.jsonl"
  test_manifest: "data/sample_val.jsonl"
  sampling_rate: 16000
  is_whisper: false
  batch_size: 2
  num_workers: 0

training:
  output_dir: "./outputs/slam_asr_toy"
  learning_rate: 0.0001
  weight_decay: 0.0
  warmup_steps: 10
  max_steps: 50
  gradient_accumulation_steps: 1
  logging_steps: 5
  eval_steps: 20
  save_steps: 25
  early_stopping_patience: 3
  device: "cpu"
